name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo generate-lockfile
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --release --package telegram-proxy --bin TelegramProxy
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramProxy-linux-x64
          path: |
            target/release/TelegramProxy
            Cargo.lock

  build-windows-10-11:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo generate-lockfile
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --release --package telegram-proxy --bin TelegramProxy --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramProxy-windows-10-11-x64
          path: |
            target/x86_64-pc-windows-msvc/release/TelegramProxy.exe
            Cargo.lock
